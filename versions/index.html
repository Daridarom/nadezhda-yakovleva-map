<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Надежда Яковлева — версии сайта</title>
<style>
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:Inter,Arial,sans-serif;color:#20383d;background:#edf1f2}.bar{min-height:72px;padding:10px 18px;display:flex;align-items:center;gap:14px;background:#fff;border-bottom:1px solid #d8e0e2;position:relative;z-index:2}.title{min-width:190px}.title strong{display:block;font-size:14px}.title span{display:block;font-size:11px;color:#6b777b;margin-top:3px}.picker{display:flex;gap:8px;overflow:auto;padding:2px;scrollbar-width:thin;flex:1}.picker button{white-space:nowrap;border:1px solid #ccd6d8;background:#f8faf9;color:#294249;border-radius:999px;padding:9px 12px;cursor:pointer;font-size:12px}.picker button[data-active="true"]{background:#294249;color:#fff;border-color:#294249}.open{white-space:nowrap;color:#294249;font-size:12px;border-bottom:1px solid #294249;text-decoration:none}.frame{width:100%;height:calc(100vh - 72px);border:0;background:#fff;display:block}
@media(max-width:720px){.bar{display:grid;grid-template-columns:1fr auto;gap:8px 12px;min-height:112px;padding:9px 12px}.title{min-width:0}.picker{grid-column:1/-1;grid-row:2}.open{grid-column:2;grid-row:1}.frame{height:calc(100vh - 112px)}}
</style>
</head>
<body>
<div class="bar"><div class="title"><strong>Надежда Яковлева · версии</strong><span>Переключайте варианты без потери предыдущих</span></div><div class="picker" id="picker"></div><a class="open" id="open" target="_blank" rel="noopener">Открыть отдельно ↗</a></div>
<iframe class="frame" id="frame" title="Предпросмотр выбранной версии"></iframe>
<script>
const versions=[["current","Текущий сайт","../"],["standard","Standard v1","standard-v1/"],["premium1","Premium Human v1","premium-human-v1/"],["transformation","Transformation v1","transformation-v1/"],["hero2","Hero v2","hero-v2/"],["reference3","Reference v3","reference-v3/"],["cards4","Cards v4","cards-v4/"],["cards5","Cards v5 · 22.09","cards-v5-feedback/"],["reference4","Reference v4 · 22.09","reference-v4-feedback/"],["premium2","Premium Human v2 · 22.09","premium-human-v2-feedback/"]];
const picker=document.querySelector("#picker"),frame=document.querySelector("#frame"),open=document.querySelector("#open");
function select(id){const item=versions.find(v=>v[0]===id)||versions[7];frame.src=item[2];open.href=item[2];history.replaceState(null,"","#"+item[0]);picker.querySelectorAll("button").forEach(b=>b.dataset.active=String(b.dataset.id===item[0]));}
versions.forEach(([id,label])=>{const b=document.createElement("button");b.textContent=label;b.dataset.id=id;b.onclick=()=>select(id);picker.appendChild(b)});select(location.hash.slice(1));
</script>
</body></html>
